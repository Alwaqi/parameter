            0.06 + index * 0.14,

          { scaleY: 1, opacity: 1, duration: 3.28, ease: "none" },
          0.88,

            { x: 74, scale: 0.985, opacity: 0 },
            { x: 0, scale: 1, opacity: 1, duration: 0.68, ease: "power3.out" },

              start + 0.08 + index * 0.055,

          { x: 0, scale: 1, opacity: 0.26, duration: 0.82, ease: "power2.out" },
