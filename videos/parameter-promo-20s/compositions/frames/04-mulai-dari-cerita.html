      <script>
        window.__timelines = window.__timelines || {};

        const f04Root = document.querySelector('[data-composition-id="04-mulai-dari-cerita"]');
        const f04 = (selector) => f04Root.querySelector(selector);
        const f04Timeline = gsap.timeline({ paused: true });

        const f04Segments = [
          { selector: "#f04-logo-segment-1", span: 10, speedFactor: 1, hold: 0.025 },
          { selector: "#f04-logo-segment-2", span: 12, speedFactor: 1, hold: 0.025 },
          { selector: "#f04-logo-segment-3", span: 11, speedFactor: 1, hold: 0.025 },
          { selector: "#f04-logo-segment-4", span: 13, speedFactor: 1, hold: 0.025 },
          { selector: "#f04-logo-segment-5", span: 10, speedFactor: 1, hold: 0.025 },
        ];

        const f04BaseDuration = 0.035;
        const f04SecondsPerUnit = 0.004;
        let f04Cumulative = 0;
        const f04Sequence = f04Segments.map((entry) => {
          const duration = (f04BaseDuration + entry.span * f04SecondsPerUnit + entry.hold) / entry.speedFactor;
          const start = 0.04 + f04Cumulative;
          f04Cumulative += duration;
          return { ...entry, start };
        });

        f04Sequence.forEach((entry) => {
          f04Timeline.fromTo(
            f04(entry.selector),
            { x: -26, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
            entry.start,
          );
        });

        f04Timeline.fromTo(
          f04("#f04-builder-line"),
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
          0.66,
        );

        f04Timeline.fromTo(
          f04("#f04-hero-state"),
          { scale: 1, opacity: 1, transformOrigin: "50% 50%" },
          { scale: 0.7, opacity: 0, duration: 0.42, ease: "power2.in", transformOrigin: "50% 50%" },
          1.5,
        );

        f04Timeline.fromTo(
          f04("#f04-cta-state"),
          { scale: 0.7, opacity: 0, transformOrigin: "50% 50%" },
          { scale: 1, opacity: 1, duration: 0.62, ease: "back.out(1.55)", transformOrigin: "50% 50%" },
          1.78,
        );

        f04Timeline.fromTo(
          f04("#f04-offer"),
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
          2.72,

          { x: 1660, y: 760, opacity: 0 },
          { x: 1120, y: 414, opacity: 1, duration: 0.85, ease: "power3.out" },

        f04Timeline.to(

          { scale: 0.92, duration: 0.13, ease: "power1.in" },
          3.8,
        );

        f04Timeline.fromTo(
          f04("#f04-ripple"),
          { scale: 0, opacity: 0.9 },
          { scale: 4.8, opacity: 0, duration: 0.55, ease: "power3.out", immediateRender: false },
          3.82,
        );

        f04Timeline.to(
          [f04("#f04-button"), f04("#f04-cursor")],
          { scale: 1, duration: 0.4, ease: "back.out(1.6)" },
