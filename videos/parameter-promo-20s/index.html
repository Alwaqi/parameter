<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0E0F13;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-bukan-sekadar-canggih"
        class="scene"
        data-composition-id="01-bukan-sekadar-canggih"
        data-composition-src="compositions/frames/01-bukan-sekadar-canggih.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-bukan-sekadar-canggih-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-yang-beneran-bekerja"
        class="scene"
        data-composition-id="02-yang-beneran-bekerja"
        data-composition-src="compositions/frames/02-yang-beneran-bekerja.html"
        data-start="4"
        data-duration="5.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-yang-beneran-bekerja-voice"
        src="assets/voice/02.wav"
        data-start="4"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-builder-dengan-bukti"
        class="scene"
        data-composition-id="03-builder-dengan-bukti"
        data-composition-src="compositions/frames/03-builder-dengan-bukti.html"
        data-start="9"
        data-duration="6.45"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-builder-dengan-bukti-voice"
        src="assets/voice/03.wav"
        data-start="9"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-mulai-dari-cerita"
        class="scene"
        data-composition-id="04-mulai-dari-cerita"
        data-composition-src="compositions/frames/04-mulai-dari-cerita.html"
        data-start="15"
        data-duration="5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-mulai-dari-cerita-voice"
        src="assets/voice/04.wav"
        data-start="15"
        data-duration="5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="20"
        data-track-index="2"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/impact-bass-1.mp3"
        data-start="0"
        data-duration="2.12"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="assets/sfx/whoosh-short.mp3"
        data-start="0"

        data-track-index="21"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-2"
        src="assets/sfx/click-soft.mp3"
        data-start="4"

        data-track-index="22"

      ></audio>
      <audio
        id="el-sfx-3"

      ></audio>
      <audio
        id="el-sfx-4"

      ></audio>
      <audio
        id="el-sfx-5"
        src="assets/sfx/pop.mp3"
        data-start="9"
        data-duration="0.72"
        data-track-index="25"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-6"
        src="assets/sfx/impact-bass-2.mp3"
        data-start="15"
        data-duration="2.59"
        data-track-index="26"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-7"
        src="assets/sfx/click.mp3"
        data-start="15"
        data-duration="0.37"
        data-track-index="27"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-bukan-sekadar-canggih", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power3.in" }, 4);
        tl.fromTo("#el-02-yang-beneran-bekerja", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4);
        tl.to("#el-02-yang-beneran-bekerja", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 9);
        tl.fromTo("#el-03-builder-dengan-bukti", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 9);
        tl.to("#el-03-builder-dengan-bukti", { scaleX: 0, transformOrigin: "left center", duration: 0.45, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-04-mulai-dari-cerita", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.45, ease: "power3.inOut" }, 15);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
